<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Card Maker</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Birthday Card Maker</h1>

    <label>お名前</label>
    <input type="text" id="name">

    <label>カードデザイン</label>
    <select id="design">
      <option value="1">黒赤</option>
      <option value="2">青1</option>
      <option value="3">青白</option>
      <option value="4">青2</option>
      <option value="5">紫</option>
    </select>

    <label>フォント</label>
    <select id="font">
      <option value="sans-serif">ゴシック</option>
      <option value="serif">明朝</option>
      <option value="'Comic Sans MS', cursive">手書き風</option>
      <option value="'Arial Rounded MT Bold', sans-serif">丸ゴシック</option>
    </select>

    <label>メッセージ</label>
    <textarea id="message" maxlength="400"></textarea>

    <div id="char-count">0 / 400文字</div>

<select id="stamp-tl">
    <option value="none">なし</option>
</select>

<select id="stamp-tr">
  <option value="none">なし</option>
  <option value="rose">ばら</option>
</select>

<select id="stamp-bl">
  <option value="none">なし</option>
  <option value="beer">ビール</option>
  <option value="H">H</option>
  <option value="K">K</option>
  <option value="champagne">シャンパン</option>
  <option value="ring">リング</option>
  <option value="kagi">鍵</option>
  <option value="DM">ドリンクミー</option>
</select>

<select id="stamp-br">
  <option value="none">なし</option>
  <option value="beer">ビール</option>
  <option value="H">H</option>
  <option value="K">K</option>
  <option value="champagne">シャンパン</option>
  <option value="ring">リング</option>
  <option value="kagi">鍵</option>
  <option value="DM">ドリンクミー</option>
</select>

    <h2>プレビュー</h2>

    <div id="card-preview">

      <div id="preview-message">
        メッセージがここに表示されます
      </div>

      <p id="preview-name">
        by Name
      </p>

      <img id="img-tl" class="stamp">
      <img id="img-tr" class="stamp">
      <img id="img-bl" class="stamp">
      <img id="img-br" class="stamp">
    </div>

    <button id="submitBtn">
      送信
    </button>

  </div>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>

</body>
</html>

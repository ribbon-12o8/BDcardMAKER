<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryoday Birthday Card Maker</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic&family=Kaisei+Decol&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <h1>Ryoday Birthday Card Maker</h1>
    <h3>もうすぐお誕生日を迎えるりょうだいさんへのバースデーメッセージカードを集めています！</h3>
    <h3>送信していただいたカードは最終的に印刷＆スクラップブックにしてりょうだいさんにお渡しする予定です。ご協力いただけたらとってもとっても嬉しいです♥</h3>
    <h3>期間はちょっと短いですが6月12日まででお願いします。</h3>
    <h6>企画・本サイト＆デザイン作成：りぼん（instagram: @ribbon_12o8）</h6>
    


    <label>お名前（なしがいい場合はスペースを入れてください）</label>
    <input type="text" id="name">

    <label>カードデザインを選ぶ</label>
    <select id="design">
      <option value="1">黒赤</option>
      <option value="2">青1</option>
      <option value="3">青白</option>
      <option value="4">青2</option>
      <option value="5">紫</option>
    </select>

    <label>メッセージのフォントを選ぶ</label>
    <select id="message-font">
      <option value="sans-serif">ゴシック</option>
      <option value="'Zen Maru Gothic', sans-serif">丸ゴシック</option>
      <option value="'Mochiy Pop One', sans-serif">ポップ</option>
      <option value="'Kaisei Decol', serif">デザイン明朝</option>

    </select>

    <label>名前のフォントを選ぶ</label>
    <select id="name-font">
      <option value="sans-serif">ゴシック</option>
      <option value="'Zen Maru Gothic', sans-serif">丸ゴシック</option>
      <option value="'Mochiy Pop One', sans-serif">ポップ</option>
      <option value="'Kaisei Decol', serif">デザイン明朝</option>
    </select>

    <label>メッセージを入力する</label>
    <textarea id="message" maxlength="400"></textarea>

    <div id="char-count">0 / 400文字</div>

    <p>デコレーションを選ぶ</p>
    <label>左上</label>
<select id="stamp-tl">
    <option value="none">なし</option>
    <option value="rose">ばら</option>
    <option value="bottleL">シャンパンボトル</option>
    <option value="beerL">ビール</option>
    <option value="HBtYL">Happy Birthday to you</option>
    <option value="crackerL">クラッカー</option>
</select>

    <label>右上</label>
<select id="stamp-tr">
    <option value="none">なし</option>
    <option value="rose">ばら</option>
    <option value="bottleR">シャンパンボトル</option>
    <option value="beerR">ビール</option>
    <option value="HBtYR">Happy Birthday to you</option>
    <option value="crackerR">クラッカー</option>
</select>

    <label>左下</label> 
<select id="stamp-bl">
    <option value="none">なし</option>
    <option value="rose">ばら</option>
    <option value="beerL">ビール</option>
    <option value="HL">H</option>
    <option value="KL">K</option>
    <option value="champagneL">シャンパンタワー</option>
    <option value="ringL">リング</option>
    <option value="kagi">鍵</option>
    <option value="DM">ドリンクミー</option>
</select>

    <label>右下</label>
<select id="stamp-br">
    <option value="none">なし</option>
    <option value="rose">ばら</option>
    <option value="beerR">ビール</option>
    <option value="HR">H</option>
    <option value="KR">K</option>
    <option value="champagneR">シャンパンタワー</option>
    <option value="ringR">リング</option>
    <option value="kagi">鍵</option>
    <option value="DM">ドリンクミー</option>
</select>

    <h2>プレビュー</h2>

    <div id="card-preview">

      <div id="preview-message">
        メッセージがここに表示されます
      </div>

      <p id="preview-name">
        Name
      </p>

      <img id="img-tl" class="stamp">
      <img id="img-tr" class="stamp">
      <img id="img-bl" class="stamp">
      <img id="img-br" class="stamp">
    </div>

    <button id="submitBtn">
      送信
    </button>

  </div>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
